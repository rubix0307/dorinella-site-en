# mypy config. Run from the repo root:  .venv/Scripts/mypy.exe --config-file mypy.ini
# SQLAlchemy 2 / pydantic v2 / FastAPI ship inline types, so no plugins are needed.
[mypy]
python_version = 3.12
files = app, scripts, tests
exclude = (?x)(^migrations/|^volumes/|^docs/|^\.venv/|^\.mypy_cache/)
# app/ is a package, tests/ and scripts/ are plain directories; `conftest`/`helpers` are imported as top-level modules
mypy_path = $MYPY_CONFIG_FILE_DIR
explicit_package_bases = True
namespace_packages = True
cache_dir = .mypy_cache

# bodies of unannotated functions are checked too (most of the code base has few annotations)
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
show_error_codes = True
show_column_numbers = False

# --- third-party packages without stubs / py.typed (real ones from the output) ---
[mypy-boto3.*,botocore.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

# --- tests: fakes stand in for AsyncSession/Request etc., and re.match(...).group() on known HTML ---
[mypy-tests.*]
disable_error_code = arg-type, union-attr

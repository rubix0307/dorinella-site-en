{# «Що далі» card of a mini-course: course overview and the last lesson. Needs `course` and `product`. #}
<section class="section" aria-labelledby="next-title">
    <div class="container">
        <div class="cta-card" data-reveal>
            <p class="eyebrow eyebrow--light">Що далі</p>
            <h2 class="section-title" id="next-title">{{ course.outro_title }}</h2>
            <p class="section-lead">{{ course.outro }}</p>
            <div class="cta-card__actions">
                {% if product.public %}<a class="btn btn--light" href="{{ url('product_detail', slug=product.slug) }}">{{ product.title }}{{ icon('arrow-right') }}</a>{% endif %}
                <a class="btn btn--outline-light" href="{{ out('https://t.me/dori_nutritioner_bot?start=' ~ course.telegram_start, 'learn-outro:' ~ course.slug) }}" target="_blank" rel="noopener">{{ icon('send') }}Курс у Telegram</a>
            </div>
        </div>
    </div>
</section>

{% from 'includes/materials/_parts.html' import head, foot %}
<section class="mat mat--bristol" id="bristol" data-reveal>
    {{ head(m) }}
    <ol class="bristol" role="list">
        {% for number, description, verdict, tone in m.items %}
            <li class="bristol__item bristol__item--{{ tone }}">
                <span class="bristol__num">{{ number }}</span>
                <svg class="bristol__shape" viewBox="0 0 64 28" aria-hidden="true" focusable="false">
                    {% if number == 1 %}
                        <circle cx="10" cy="15" r="4"/><circle cx="22" cy="8" r="4"/><circle cx="34" cy="18" r="4"/><circle cx="46" cy="9" r="4"/><circle cx="55" cy="20" r="3.5"/>
                    {% elif number == 2 %}
                        <ellipse cx="18" cy="14" rx="12" ry="9"/><ellipse cx="32" cy="14" rx="12" ry="9"/><ellipse cx="46" cy="14" rx="11" ry="8"/>
                    {% elif number == 3 %}
                        <ellipse cx="32" cy="14" rx="28" ry="9"/><path class="bristol__crack" d="M16 9 l4 5 M28 7 l3 6 M40 10 l-3 6 M50 12 l-4 4"/>
                    {% elif number == 4 %}
                        <rect x="6" y="9" width="52" height="10" rx="5"/>
                    {% elif number == 5 %}
                        <ellipse cx="10" cy="15" rx="6" ry="5"/><ellipse cx="25" cy="10" rx="6" ry="5"/><ellipse cx="40" cy="17" rx="6" ry="5"/><ellipse cx="54" cy="11" rx="5" ry="4.5"/>
                    {% elif number == 6 %}
                        <circle cx="10" cy="16" r="5"/><circle cx="20" cy="9" r="5"/><circle cx="31" cy="17" r="5"/><circle cx="41" cy="9" r="5"/><circle cx="51" cy="17" r="5"/><circle cx="57" cy="10" r="3.5"/>
                    {% else %}
                        <path d="M4 20 Q8 9 20 12 Q30 3 42 11 Q58 8 60 19 Q52 25 40 22 Q28 27 14 24 Q6 25 4 20 Z"/>
                    {% endif %}
                </svg>
                <span class="bristol__text">{{ description }}</span>
                <span class="bristol__verdict">{{ verdict }}</span>
            </li>
        {% endfor %}
    </ol>
    {{ foot(m) }}
</section>

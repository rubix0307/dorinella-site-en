{% from 'includes/materials/_parts.html' import head, foot %}
{# The drawing is shown cropped to the two figures: its own title and captions are said again in text below. #}
<section class="mat mat--posture" id="posture" data-reveal>
    {{ head(m) }}
    <figure class="posture__figure">
        <img src="{{ static('img/learn/' ~ m.image ~ '-full.webp') }}" width="967" height="660" alt="{{ m.alt }}" loading="lazy" decoding="async">
    </figure>
    <div class="posture__cols">
        {% for name, text in m.items %}
            <div class="posture__col posture__col--{{ loop.index }}">
                <h4 class="posture__name">{{ name }}</h4>
                <p>{{ text }}</p>
            </div>
        {% endfor %}
    </div>
    {{ foot(m) }}
</section>

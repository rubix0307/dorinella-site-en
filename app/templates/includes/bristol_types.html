{# The seven shapes of the Bristol stool scale, drawn so each one is recognisable on its own (colour comes from .bt in styles.css).
   Use: {% from 'includes/bristol_types.html' import bristol_type %}{{ bristol_type(4) }} #}
{% macro bristol_type(n) -%}
<svg class="bt bt--{{ n }}" viewBox="0 0 96 56" width="96" height="56" aria-hidden="true" focusable="false">
{%- if n == 1 %}
    {# separate hard lumps, like nuts #}
    <g class="bt-body">
        <ellipse cx="13" cy="33" rx="7" ry="6.2"/><ellipse cx="31" cy="21" rx="6" ry="5.6"/><ellipse cx="49" cy="35" rx="7.6" ry="6.6"/>
        <ellipse cx="67" cy="21" rx="6" ry="5.6"/><ellipse cx="83" cy="35" rx="6.6" ry="6"/>
    </g>
    <g class="bt-light"><ellipse cx="11" cy="30.5" rx="2.4" ry="1.5"/><ellipse cx="29.4" cy="18.8" rx="2" ry="1.3"/><ellipse cx="46.6" cy="32.4" rx="2.6" ry="1.6"/><ellipse cx="65.4" cy="18.8" rx="2" ry="1.3"/><ellipse cx="81" cy="32.6" rx="2.2" ry="1.4"/></g>
{%- elif n == 2 %}
    {# a sausage made of lumps stuck together #}
    <g class="bt-body">
        <rect x="8" y="19" width="80" height="22" rx="11"/>
        <circle cx="20" cy="19" r="5.4"/><circle cx="34" cy="17.5" r="5.8"/><circle cx="49" cy="18.5" r="5.4"/><circle cx="63" cy="17.5" r="5.8"/><circle cx="77" cy="19" r="5.2"/>
        <circle cx="27" cy="41" r="5.4"/><circle cx="42" cy="42.5" r="5.8"/><circle cx="56" cy="41.5" r="5.4"/><circle cx="70" cy="42" r="5.2"/>
    </g>
    <g class="bt-dark"><path d="M27 21c1 4 1 8 0 12M42 21c1 4 1 9 0 13M56 21c1 4 1 8 0 12M70 21c1 4 1 8 0 12"/></g>
    <g class="bt-light"><ellipse cx="22" cy="17" rx="3" ry="1.5"/><ellipse cx="36" cy="15.5" rx="3" ry="1.5"/><ellipse cx="51" cy="16.5" rx="3" ry="1.5"/><ellipse cx="65" cy="15.5" rx="3" ry="1.5"/></g>
{%- elif n == 3 %}
    {# a sausage with cracks across the surface #}
    <rect class="bt-body" x="6" y="17" width="84" height="24" rx="12"/>
    <g class="bt-dark"><path d="M24 17.5l3 6-2.5 4M40 17.5l-2 5 3 4M57 17.5l3 5-2 4M73 17.5l-2 5 3 4M31 40.5l-3-5 2.5-3.5M49 40.5l2-5-3-3.5M66 40.5l-2-5 3-3.5"/></g>
    <g class="bt-light"><rect x="14" y="21" width="30" height="3" rx="1.5"/><rect x="50" y="21" width="22" height="3" rx="1.5"/></g>
{%- elif n == 4 %}
    {# the ideal: a smooth, soft snake #}
    <path class="bt-line" d="M11 39C26 17 40 47 58 30S80 21 86 25"/>
    <path class="bt-line-hi" d="M11 35C26 14 40 43 58 26S80 17 86 21"/>
{%- elif n == 5 %}
    {# soft blobs with clear-cut edges #}
    <g class="bt-body"><ellipse cx="20" cy="33" rx="13" ry="10"/><ellipse cx="48" cy="22" rx="12" ry="9"/><ellipse cx="75" cy="35" rx="13" ry="10"/></g>
    <g class="bt-light"><ellipse cx="16" cy="29" rx="5" ry="2.4"/><ellipse cx="45" cy="18.4" rx="4.6" ry="2.2"/><ellipse cx="71" cy="31" rx="5" ry="2.4"/></g>
{%- elif n == 6 %}
    {# fluffy, mushy pieces with ragged edges #}
    <g class="bt-body bt-body--soft">
        <path d="M6 36l3-9 5 3 4-8 6 5 5-6 4 7 5-2 3 8-4 6-5-2-5 5-5-3-6 4-5-3z"/>
        <path d="M47 24l4-8 5 4 4-6 5 6 5-3 2 8-3 5 4 5-5 4-5-3-5 4-5-4-4 2z"/>
        <path d="M66 40l4-6 5 3 5-5 5 6-2 6-6 2-5-2-5 3z"/>
    </g>
    <g class="bt-light"><circle cx="18" cy="31" r="1.8"/><circle cx="55" cy="26" r="1.8"/><circle cx="76" cy="39" r="1.6"/></g>
    <g class="bt-body bt-body--soft"><circle cx="40" cy="44" r="2"/><circle cx="90" cy="30" r="1.8"/><circle cx="35" cy="14" r="1.6"/></g>
{%- else %}
    {# watery, no solid pieces #}
    <path class="bt-liquid" d="M5 41c3-9 14-6 22-10s22-8 32-2 24-4 30 7c3 7-9 12-40 12S2 49 5 41z"/>
    <path class="bt-wave" d="M16 42c6-3 10 2 16-1s10 2 17-1 11 2 17-1 9 1 14-1"/>
    <g class="bt-liquid"><path d="M34 8c2.4 3.4 3.6 5.4 3.6 7.4a3.6 3.6 0 0 1-7.2 0c0-2 1.2-4 3.6-7.4z"/><path d="M60 3c1.8 2.6 2.7 4.1 2.7 5.6a2.7 2.7 0 0 1-5.4 0c0-1.5.9-3 2.7-5.6z"/><path d="M76 13c1.5 2.1 2.2 3.3 2.2 4.5a2.2 2.2 0 0 1-4.4 0c0-1.2.7-2.4 2.2-4.5z"/></g>
{%- endif %}
</svg>
{%- endmacro %}

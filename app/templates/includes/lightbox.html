<dialog class="lightbox" id="lightbox" aria-label="Сертифікат">
    <figure class="lightbox__figure">
        <img class="lightbox__img" alt="">
        <figcaption class="lightbox__caption"><strong></strong><span></span></figcaption>
    </figure>
    <button type="button" class="lightbox__btn lightbox__close" data-lightbox="close" aria-label="Закрити">{{ micon('x') }}</button>
    <button type="button" class="lightbox__btn lightbox__prev" data-lightbox="prev" aria-label="Попередній">{{ icon('chevron-left') }}</button>
    <button type="button" class="lightbox__btn lightbox__next" data-lightbox="next" aria-label="Наступний">{{ icon('chevron-right') }}</button>
</dialog>

{% set a = course.AUTHOR %}
<section class="abm-block abm-author">
    {# TODO(owner): replace the site illustration with the author's photo #}
    <figure class="abm-author__photo"><img src="{{ static('img/guts-hero-500.webp') }}" width="500" height="526" alt="" loading="lazy" decoding="async"></figure>
    <div class="abm-author__text">
        <h2 class="abm-h2">{{ a.name }}</h2>
        {% for p in a.paras %}<p>{{ p }}</p>{% endfor %}
        <p class="abm-author__motto">{{ a.motto }}</p>
    </div>
</section>

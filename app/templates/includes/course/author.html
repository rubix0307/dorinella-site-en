{% set a = course.AUTHOR %}
<section class="abm-block abm-author">
    <figure class="abm-author__photo"><img src="{{ static('img/author-320.webp') }}" srcset="{{ static('img/author-320.webp') }} 320w, {{ static('img/author-640.webp') }} 640w" sizes="(min-width: 700px) 260px, 90vw" width="640" height="640" alt="{{ a.name }}" loading="lazy" decoding="async"></figure>
    <div class="abm-author__text">
        <h2 class="abm-h2">{{ a.name }}</h2>
        {% for p in a.paras %}<p>{{ p }}</p>{% endfor %}
        <p class="abm-author__motto">{{ a.motto }}</p>
    </div>
</section>

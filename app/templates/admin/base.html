<!DOCTYPE html>
<html lang="{{ lang }}" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <title>{% block title %}{{ _('Admin') }}{% endblock %} · {{ site.BRAND }}</title>
    <link rel="icon" href="{{ static('img/favicon.svg') }}" type="image/svg+xml">
    {{ font_preloads() }}
    <link href="{{ static('css/styles.css') }}" rel="stylesheet">
    <link href="{{ static('css/admin.css') }}" rel="stylesheet">
    <script src="{{ static('js/no-js.js') }}"></script>
    <script src="{{ static('js/main.js') }}" defer></script>
    <script src="{{ static('js/admin-i18n.js') }}" defer></script>      {# first: the others call t() #}
    <script src="{{ static('js/admin-confirm.js') }}" defer></script>
    <script src="{{ static('js/admin-autofilter.js') }}" defer></script>
    <script src="{{ static('js/admin.js') }}" defer></script>
    {{ import_map(request) }}
    <link rel="modulepreload" href="{{ static('vendor/morphicons/dom.js') }}">
    <script src="{{ static('js/morph.js') }}" type="module"></script>
    {% block head %}{% endblock %}
</head>
<body class="admin theme-main">
<a class="skip-link" href="#admin-content">{{ _('Skip to content') }}</a>
<script type="application/json" id="admin-i18n">{{ js_strings(lang)|tojson }}</script>
{% include 'includes/icons.html' %}
{% block body %}{% endblock %}
</body>
</html>

[project]
name = "lolakrissss"
version = "0.1.0"
description = "lolakrissss.com: the English gut massage guide site on FastAPI, containerized with uv"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
    "SQLAlchemy[asyncio]==2.1.2",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "tzdata==2025.2",
    "sentry-sdk[fastapi]==2.71.0",
    "boto3==1.43.108",        # the daily backup to a private bucket (app/backup.py)
    "cryptography==50.0.2",   # seals the backup
]

[tool.pytest.ini_options]
testpaths = ["tests"]   # never walk into volumes/ (database files) or media/

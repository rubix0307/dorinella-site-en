# Production: deploy.sh runs it (blue-green, see there) — don't `up -d` it by hand.
# The same server also runs the Ukrainian site (project "dorinella": ports 8001/8002, its own database),
# so this project has its own name, ports (8003/8004), network, database and upstream file.
name: lolakrissss

x-web: &web
  build:
    context: .
    dockerfile: Dockerfile
  image: lolakrissss-web:latest
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lolakrissss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lolakrissss}
    - SENTRY_RELEASE=${SENTRY_RELEASE:-}   # the deployed git commit (deploy.sh)
  # migrations are a separate step in deploy.sh, so two colors never race on them;
  # X-Forwarded-* is trusted because only the host can connect
  command: >-
    uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_WORKERS:-2}
    --proxy-headers --forwarded-allow-ips '*'
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
    interval: 5s
    timeout: 5s
    retries: 3
    start_period: 20s
  security_opt:
    - no-new-privileges:true
  networks:
    - app-net
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 384m
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lolakrissss}
      POSTGRES_USER: ${POSTGRES_USER:-lolakrissss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # The data lives in the project folder (volumes/, gitignored). PG 18 keeps it in /var/lib/postgresql/18/docker:
    # mount the parent, not .../data.
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Blue-green: one color serves, the other is stopped. deploy.sh starts the idle one with the new image, waits for its
  # healthcheck, points nginx at its port (/etc/nginx/conf.d/lolakrissss-upstream.conf) and only then stops the old one.
  web_blue:
    <<: *web
    ports:
      - "127.0.0.1:8003:8000"

  web_green:
    <<: *web
    ports:
      - "127.0.0.1:8004:8000"

  # The daily database backup (app/backup.py): pg_dump, sealed with BACKUP_KEY, put to a private bucket. One copy only;
  # deploy.sh starts it when BACKUP_S3_BUCKET is set in .env (profile "backup").
  backup:
    <<: *web
    profiles: ["backup"]
    command: python -m app.backup
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

networks:
  app-net:
    driver: bridge

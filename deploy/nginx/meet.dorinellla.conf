# /etc/nginx/conf.d/meet.dorinellla.conf — https://meet.dorinellla.com: signalling of the video calls (LiveKit, wss).
# Only the WebSocket goes through here; the media (voices) flows straight to the server on 7881/tcp and 7882/udp.
# Certificate: certbot certonly --nginx -d meet.dorinellla.com (renewed by certbot's timer).

server {
    listen 80;
    server_name meet.dorinellla.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name meet.dorinellla.com;

    ssl_certificate /etc/letsencrypt/live/meet.dorinellla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.dorinellla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;       # a call is a long-lived WebSocket
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header X-Content-Type-Options nosniff always;
    }
}

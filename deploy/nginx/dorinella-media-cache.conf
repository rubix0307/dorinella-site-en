# /etc/nginx/conf.d/dorinella-media-cache.conf — the disk cache for media.dorinellla.com (http context).
# Recipe media live in the Backblaze bucket; nginx serves them on media.dorinellla.com and keeps a copy here,
# so the bucket is asked once per file (per 1 MB slice of a video), not on every view.
proxy_cache_path /var/cache/nginx/dorinella-media levels=1:2 keys_zone=dorinella_media:10m
                 max_size=3g inactive=60d use_temp_path=off;

# /etc/nginx/conf.d/lolakrissss.com.conf — the English site. The upstream (lolakrissss_web) is written by deploy.sh into
# /etc/nginx/conf.d/lolakrissss-upstream.conf. For the very first run create that file by hand:
#   upstream lolakrissss_web { server 127.0.0.1:8003; }
# Certificate: certbot --nginx -d lolakrissss.com -d www.lolakrissss.com (fills in the ssl lines and the :80 redirect).
server {
    server_name lolakrissss.com;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 10M;

    location / {
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the visitor's address only, never a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live admin updates (WebSocket)
    location = /admin/ws {
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    listen 80;
}

server {
    listen 80;
    server_name www.lolakrissss.com;
    return 301 https://lolakrissss.com$request_uri;
}

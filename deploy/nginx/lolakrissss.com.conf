# /etc/nginx/conf.d/lolakrissss.com.conf — the English site. The upstream (lolakrissss_web) is written by deploy.sh into
# /etc/nginx/conf.d/lolakrissss-upstream.conf. For the very first run create that file by hand:
#   upstream lolakrissss_web { server 127.0.0.1:8003; }
# Certificate: certbot --nginx -d lolakrissss.com -d www.lolakrissss.com (fills in the ssl lines and the :80 redirect).
# one address may send 10 requests a second (a burst of 20) to the public writes; the zone lives in the http context, where conf.d is included
limit_req_zone $binary_remote_addr zone=lk_public:10m rate=10r/s;

server {
    server_name lolakrissss.com;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # the Content-Security-Policy is sent by the app (it needs a nonce per page)

    client_max_body_size 10M;

    location / {
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the visitor's address only, never a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the public JSON and the test forms take a few hundred bytes: a small body limit keeps a huge request from being parsed;
    # sign-in (Google One Tap makes outbound calls on every POST) shares the rate limit
    location ~ ^/(api|tests|auth)/ {
        client_max_body_size 64k;
        limit_req zone=lk_public burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe's signed notification: not rate-limited (Stripe retries from a few addresses); the body is a few KB, so 256k is generous
    location = /stripe/webhook {
        client_max_body_size 256k;
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live admin updates (WebSocket)
    location = /admin/ws {
        proxy_pass http://lolakrissss_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    listen 80;
}

server {
    listen 80;
    server_name www.lolakrissss.com;
    return 301 https://lolakrissss.com$request_uri;
}

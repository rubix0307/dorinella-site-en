server {
    server_name dorinellla.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 20M;

    # Serve static files from your custom folder

    # Proxy traffic to Gunicorn (Docker container running on port 8000)
    # FastAPI app (docker compose project "dorinella", /root/dorinella); it serves /static/ itself
    location / {
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the visitor's address only, never a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the files of a Telegram post (admin): 50 MB each, 100 MB per post, so this one address takes more than the 20M everything else is held to
    location ~ ^/admin/telegram/posts/[0-9]+/media$ {
        client_max_body_size 110M;
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # the pictures of an article (admin, 15 MB): the app reads a multipart body before it checks the session, so the size is held here
    location ~ ^/admin/articles/[0-9]+/media$ {
        client_max_body_size 16M;
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live admin updates (WebSocket)
    location = /admin/ws {
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # the support chat: a message with a file (5 MB) is held to 6M here, and the chat sockets need the WebSocket headers
    location ~ ^/(account|admin)/support/(new|[0-9]+/send)$ {
        client_max_body_size 6M;
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(account|admin)/support/ws$ {
        proxy_pass http://dorinella_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/dorinellla.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dorinellla.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
# One host, https://dorinellla.com, so one visitor-id cookie (__Host- cookies never cross hosts).
# www.dorinellla.com has no DNS record and the certificate covers dorinellla.com only. If www is ever added
# to DNS: `certbot certonly --nginx --expand -d dorinellla.com -d www.dorinellla.com`, then a server block
# for www on 443 (same certificate) that does `return 301 https://dorinellla.com$request_uri;`.
server {
    listen 80;
    server_name dorinellla.com www.dorinellla.com;
    return 301 https://dorinellla.com$request_uri;
}
# /etc/nginx/conf.d/media.dorinellla.conf — https://media.dorinellla.com: recipe videos and images.
# The files live in the public Backblaze bucket; nginx serves them under our own name and keeps a copy
# on this server (the cache zone is in dorinella-media-cache.conf), so B2 is asked once per file / slice.
# Certificate: certbot certonly --nginx -d media.dorinellla.com (renewed by certbot's timer).

server {
    listen 80;
    server_name media.dorinellla.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.dorinellla.com;

    ssl_certificate /etc/letsencrypt/live/media.dorinellla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.dorinellla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / { return 404; }                       # no listing, nothing at the root
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }

    location / {
        limit_except GET { deny all; }                 # GET also allows HEAD

        # videos are fetched and cached in 1 MB pieces: seeking works, a first view doesn't pull the whole file
        slice 1m;
        proxy_cache dorinella_media;
        proxy_cache_key $uri$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 60d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Expires;

        rewrite ^/(.*)$ /file/dorinellla-site/$1 break;
        proxy_pass https://f003.backblazeb2.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host f003.backblazeb2.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # nothing about the bucket leaks out
        proxy_hide_header x-bz-file-name;
        proxy_hide_header x-bz-file-id;
        proxy_hide_header x-bz-content-sha1;
        proxy_hide_header x-bz-upload-timestamp;
        proxy_hide_header x-bz-info-src_last_modified_millis;
        proxy_hide_header x-bz-server-side-encryption;
        proxy_hide_header Content-Disposition;

        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "https://dorinellla.com" always;   # the site's own pages only
        add_header X-Cache $upstream_cache_status always;
    }
}
